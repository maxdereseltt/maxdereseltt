<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEMS SPERR-MODUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lockdown-container">
        <h1 id="headline">⚠️ ALLE DATEN WERDEN IN 48 STUNDEN ENTFERNT ⚠️</h1>
        <p id="status-message">SYSTEM GESPERRT – Bitte um Zugangscode eingeben.</p>

        <!-- Passwort Eingabefeld -->
        <div id="input-area">
            <input type="password" id="passwordInput" placeholder="Passwort eingeben">
            <button id="unlockButton">Entsperren</button>
        </div>

        <!-- Anzeige der Zeit -->
        <div id="timer-display">
            Verbleibende Zeit: <span id="timeRemaining">48 Stunden</span>
        </div>

        <!-- Bereich für den "entsperrten" Inhalt, der verborgen ist -->
        <div id="content-area" style="display: none;">
            <h2>🚀 System Entsperrt!</h2>
            <p>Alle Funktionen sind wieder voll zugänglich.</p>
            <button id="lockButtonSecondary">System manuell sperren</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
